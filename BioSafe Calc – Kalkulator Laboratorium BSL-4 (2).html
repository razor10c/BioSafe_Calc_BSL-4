<!DOCTYPE html>
<html lang="id">
<head>

<title>BioSafe Calc – Kalkulator Laboratorium BSL-4</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#040b14;--pn:rgba(10,26,44,.64);--ln:rgba(80,190,255,.17);--tx:#e4f3ff;--mu:#7f98b0;--ac:#2cd9ff;--a2:#ffb81f;--ok:#37f5a3;--bad:#ff4a67;--key:rgba(40,90,130,.32);--sh:0 12px 44px rgba(0,0,0,.5);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e8f1f8;--pn:rgba(255,255,255,.74);--ln:rgba(0,80,130,.2);--tx:#08192a;--mu:#4d647a;--ac:#0071ad;--a2:#b86400;--ok:#078a56;--bad:#cf1838;--key:rgba(0,90,140,.08);--sh:0 10px 30px rgba(0,50,90,.16);color-scheme:light}}
:root[data-theme="light"]{--bg:#e8f1f8;--pn:rgba(255,255,255,.74);--ln:rgba(0,80,130,.2);--tx:#08192a;--mu:#4d647a;--ac:#0071ad;--a2:#b86400;--ok:#078a56;--bad:#cf1838;--key:rgba(0,90,140,.08);--sh:0 10px 30px rgba(0,50,90,.16);color-scheme:light}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{min-height:100vh;background:var(--bg);color:var(--tx);font:15px/1.5 'Chakra Petch',system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(700px 460px at 12% -5%,color-mix(in srgb,var(--ac) 22%,transparent),transparent),radial-gradient(560px 420px at 95% 105%,color-mix(in srgb,var(--a2) 16%,transparent),transparent),linear-gradient(var(--ln) 1px,transparent 1px) 0 0/46px 46px,linear-gradient(90deg,var(--ln) 1px,transparent 1px) 0 0/46px 46px}
body::after{content:"";position:fixed;left:0;right:0;top:0;height:160px;z-index:-1;pointer-events:none;background:linear-gradient(transparent,color-mix(in srgb,var(--ac) 9%,transparent),transparent);animation:sweep 9s linear infinite}
@keyframes sweep{from{transform:translateY(-200px)}to{transform:translateY(110vh)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--a2);outline-offset:2px}
.mu{color:var(--mu)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;max-width:1280px;margin:0 auto;padding:16px 16px 0}
.logo{width:50px;height:50px;display:grid;place-items:center;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);background:linear-gradient(135deg,var(--a2),var(--bad));color:#1a0a00;font-size:28px}
.logo span{animation:spin 16s linear infinite}
h1{font-size:1.3rem;font-weight:700;line-height:1.1}
h1 small{display:block;font-size:.78rem;font-weight:400;color:var(--mu)}
.sp{flex:1}
.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--ln);border-radius:99px;padding:5px 13px;font-size:.78rem;color:var(--mu);background:var(--pn);backdrop-filter:blur(10px)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 1.6s infinite}
#clk{font-family:'JetBrains Mono',monospace;color:var(--tx)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);gap:16px;max-width:1280px;margin:0 auto;padding:16px}
.pn{background:var(--pn);backdrop-filter:blur(18px);border:1px solid var(--ln);border-radius:20px;box-shadow:var(--sh);position:relative;overflow:hidden}
.pn::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--ac),var(--a2),transparent)}
.nav{display:flex;flex-direction:column;gap:5px;padding:10px;align-self:start}
.nav button{display:flex;gap:11px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;color:var(--mu);border:1px solid transparent;transition:.2s}
.nav button:hover{color:var(--tx);background:var(--key)}
.nav button.on{color:var(--tx);border-color:var(--ln);background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 24%,transparent),transparent);box-shadow:inset 3px 0 var(--ac)}
.nav i{font-style:normal;width:22px;text-align:center;color:var(--ac);font-size:1.1rem}
.calc{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px}
.disp{padding:18px 20px;text-align:right;position:relative;margin-bottom:12px;border-radius:16px;border:1px solid var(--ln);background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 7%,transparent),transparent),var(--key)}
.disp.err{animation:shake .35s}
#ex{font:400 1rem 'JetBrains Mono',monospace;color:var(--mu);min-height:1.6em;overflow-x:auto;white-space:nowrap}
#rs{font:600 clamp(2rem,6vw,3.3rem)/1.15 'JetBrains Mono',monospace;color:var(--ac);text-shadow:0 0 22px color-mix(in srgb,var(--ac) 55%,transparent);overflow-x:auto;white-space:nowrap}
#md{position:absolute;left:14px;top:12px;font-size:.75rem;padding:2px 10px;border-radius:99px;border:1px solid var(--a2);color:var(--a2)}
.pad{padding:14px}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.k{height:50px;border-radius:13px;background:var(--key);border:1px solid var(--ln);font-family:'JetBrains Mono',monospace;font-size:.98rem;transition:transform .08s,box-shadow .2s,background .2s}
.k:hover{background:color-mix(in srgb,var(--ac) 18%,var(--key));box-shadow:0 0 16px color-mix(in srgb,var(--ac) 35%,transparent)}
.k:active{transform:scale(.93)}
.k.f{color:var(--ac);font-size:.86rem}
.k.o{color:var(--a2);font-size:1.15rem}
.k.c{color:var(--bad)}
.k.t{color:var(--a2);border-color:var(--a2)}
.k.eq{grid-column:span 2;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 55%,var(--a2)));color:#021018;font-weight:700;font-size:1.3rem;border:0}
.side{padding:14px;display:flex;flex-direction:column;gap:12px;max-height:640px}
.side h3,.mod h2{font-size:1rem;font-weight:700}
#hs{display:flex;flex-direction:column;gap:6px;overflow-y:auto;flex:1;min-height:120px}
#hs button{text-align:right;padding:8px 10px;border-radius:10px;background:var(--key);font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--mu)}
#hs button b{display:block;color:var(--tx);font-size:.95rem}
#hs button:hover{outline:1px solid var(--ac)}
.cs{display:flex;flex-wrap:wrap;gap:6px}
.cs button{padding:4px 10px;border-radius:99px;border:1px solid var(--ln);font-size:.78rem;color:var(--a2);font-family:'JetBrains Mono',monospace}
.cs button:hover{border-color:var(--a2)}
.mod{padding:22px}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:18px 0}
label span{display:block;font-size:.82rem;color:var(--mu);margin-bottom:4px}
input,select{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--ln);background:var(--key);color:var(--tx);font:1rem 'JetBrains Mono',monospace}
input:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent);outline:0}
select option{background:#0a1a2c;color:#e4f3ff}
.out{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.res{text-align:left;padding:14px 16px;border-radius:15px;border:1px solid var(--ln);background:var(--key);animation:pop .4s both;animation-delay:calc(var(--i)*40ms);transition:.2s}
.res:hover{border-color:var(--ac);transform:translateY(-2px)}
.res small{display:block;color:var(--mu);font-size:.8rem}
.res b{display:block;font:600 1.5rem 'JetBrains Mono',monospace;overflow-wrap:anywhere}
.res i{font-style:normal;font-size:.76rem;color:var(--mu)}
.res.hl{border-color:var(--a2);background:linear-gradient(135deg,color-mix(in srgb,var(--a2) 20%,transparent),var(--key))}
.res.hl b{color:var(--a2)}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;padding:8px 18px;border-radius:99px;background:var(--ok);color:#021810;font-weight:600;transition:.3s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
footer{max-width:1280px;margin:0 auto;padding:0 16px 24px;font-size:.78rem;color:var(--mu)}
.cs{margin:8px 0}.cs button.on{border-color:var(--ac);color:var(--tx);background:color-mix(in srgb,var(--ac) 22%,transparent)}.cs input{width:auto;min-width:240px;flex:1;padding:6px 12px;border-radius:99px;font-size:.85rem}
#gc{display:block;width:100%;height:clamp(300px,55vh,500px);border-radius:16px;border:1px solid var(--ln);background:var(--key);touch-action:none;cursor:crosshair;margin:12px 0}
.stage{height:min(62vh,520px);min-height:340px;border-radius:16px;border:1px solid var(--ln);background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--ac) 16%,transparent),transparent 70%),var(--key);overflow:hidden;touch-action:none;cursor:grab;margin:12px 0}.stage:active{cursor:grabbing}.stage canvas{display:block;width:100%;height:100%}
.ptw{overflow-x:auto;padding-bottom:8px;margin:12px 0}.pt{display:grid;grid-template-columns:repeat(18,minmax(48px,1fr));grid-template-rows:repeat(7,auto) 14px repeat(2,auto);gap:4px;min-width:900px}
.el{display:flex;flex-direction:column;align-items:center;padding:5px 2px;border-radius:9px;border:1px solid color-mix(in srgb,var(--c) 70%,transparent);background:color-mix(in srgb,var(--c) 20%,var(--key));transition:.18s}.el:hover{transform:scale(1.18);z-index:2;box-shadow:0 0 18px var(--c);background:color-mix(in srgb,var(--c) 42%,var(--key))}.el small{font-size:.6rem;color:var(--mu);align-self:flex-start;padding-left:4px}.el b{font-size:1.08rem;line-height:1.2}
.lbl{display:grid;place-items:center;font-size:.62rem;color:var(--mu)}
#ov{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(2,8,16,.74);backdrop-filter:blur(6px);padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));overflow-y:auto}
#ov .pn{width:min(1060px,100%);max-height:100%;overflow-y:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;padding:18px}#ov .stage{height:min(46vh,420px);min-height:300px;margin:8px 0}
.hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.big{font:700 3.4rem/1 'JetBrains Mono',monospace;color:var(--c);text-shadow:0 0 24px var(--c)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:.88rem;margin-top:10px}.kv span{color:var(--mu)}.kv b{font-weight:600;overflow-wrap:anywhere}
.ex{margin-top:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--key);font-size:.88rem}
@media(max-width:800px){#ov .pn{grid-template-columns:1fr}.kv{grid-template-columns:120px 1fr}}
@media(max-width:900px){.calc{grid-template-columns:1fr}.side{max-height:none}}
@media(max-width:820px){.app{grid-template-columns:1fr}.nav{flex-direction:row;overflow-x:auto}.nav button{white-space:nowrap;flex:none}}
@media(max-width:430px){.k{height:44px;font-size:.84rem}.keys{gap:6px}.pad{padding:10px}}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
</style>

<body>
<header>
 <div class="logo"><span>☣</span></div>
 <h1>BioSafe Calc<small>Suite komputasi laboratorium BSL-4</small></h1>
 <div class="sp"></div>
 <div class="chip"><span class="dot"></span>Berjalan lokal, tanpa kirim data</div>
 <div class="chip" id="clk">--:--:--</div>
 <button class="chip" id="th" aria-label="Ganti tema">◐ Tema</button>
</header>
<div class="app">
 <nav class="pn nav" id="nav"></nav>
 <main id="view"></main>
</div>
<footer>Alat bantu hitung. Selalu verifikasi hasil dengan SOP, lembar data bahan, dan prosedur validasi laboratorium Anda sebelum digunakan.</footer>
<div id="toast">Disalin</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const fmt=n=>{if(typeof n!=='number')return n;if(!isFinite(n))return '—';const a=Math.abs(n);if(a!==0&&(a>=1e9||a<1e-4))return n.toExponential(6).replace(/\.?0+e/,'e').replace('e+','e');return String(parseFloat(n.toPrecision(10)))};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1100)};
const copy=t=>{try{navigator.clipboard.writeText(t).then(()=>toast('Disalin: '+t))}catch(e){toast('Tidak bisa menyalin')}};

/* ---------- Parser ekspresi (tanpa eval) ---------- */
function fa(n){if(n<0||n%1||n>170)return NaN;let r=1;for(let k=2;k<=n;k++)r*=k;return r}
function evalX(src,deg,ans,V){
 const s=src.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'pi').replace(/√/g,'sqrt').replace(/\s/g,'').toLowerCase();let i=0;
 const rd=x=>deg?x*Math.PI/180:x,bk=x=>deg?x*180/Math.PI:x;
 const F={sin:x=>Math.sin(rd(x)),cos:x=>Math.cos(rd(x)),tan:x=>Math.tan(rd(x)),asin:x=>bk(Math.asin(x)),acos:x=>bk(Math.acos(x)),atan:x=>bk(Math.atan(x)),ln:Math.log,log:Math.log10,sqrt:Math.sqrt,cbrt:Math.cbrt,abs:Math.abs,exp:Math.exp};
 const C={pi:Math.PI,e:Math.E,ans,...V};
 const ex=()=>{let v=tm();while(s[i]=='+'||s[i]=='-'){const o=s[i++],r=tm();v=o=='+'?v+r:v-r}return v};
 const tm=()=>{let v=un();for(;;){const c=s[i];if(c=='*'||c=='/'){i++;const r=un();v=c=='*'?v*r:v/r}else if(c&&(c=='('||/[a-z]/.test(c)))v*=pw();else return v}};
 const un=()=>{if(s[i]=='-'){i++;return -un()}if(s[i]=='+'){i++;return un()}return pw()};
 const pw=()=>{const b=pf();if(s[i]=='^'){i++;return Math.pow(b,un())}return b};
 const pf=()=>{let v=pr();while(s[i]=='!'||s[i]=='%')v=s[i++]=='!'?fa(v):v/100;return v};
 const pr=()=>{
  if(s[i]=='('){i++;const v=ex();if(s[i]!=')')throw 0;i++;return v}
  const t=s.slice(i),m=/^(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?/.exec(t);
  if(m){i+=m[0].length;return parseFloat(m[0])}
  const n=/^[a-z]+/.exec(t);if(!n)throw 0;const id=n[0];i+=id.length;
  if(id=='fact'||id in F){if(s[i]!='(')throw 0;i++;const v=ex();if(s[i]!=')')throw 0;i++;return id=='fact'?fa(v):F[id](v)}
  if(id in C)return C[id];throw 0};
 const r=ex();if(i<s.length)throw 0;return r}

/* ---------- Kalkulator ilmiah ---------- */
let cx='',deg=true,ans=0,hist=[],fresh=0;
const K=[['DEG','DEG','t'],['sin','sin(','f'],['cos','cos(','f'],['tan','tan(','f'],['ln','ln(','f'],['log','log(','f'],
['sin⁻¹','asin(','f'],['cos⁻¹','acos(','f'],['tan⁻¹','atan(','f'],['√','√(','f'],['x²','^2','f'],['xʸ','^','f'],
['π','π','f'],['e','e','f'],['n!','!','f'],['(','(','f'],[')',')','f'],['⌫','⌫','c'],
['7'],['8'],['9'],['÷','÷','o'],['Ans','ans','f'],['AC','AC','c'],
['4'],['5'],['6'],['×','×','o'],['|x|','abs(','f'],['%','%','f'],
['1'],['2'],['3'],['−','−','o'],['∛','cbrt(','f'],['eˣ','exp(','f'],
['0'],['.'],['10ˣ','10^(','f'],['+','+','o'],['=','=','eq']];
const CS=[['N_A','6.02214076e23'],['R','8.314462618'],['k_B','1.380649e-23'],['h','6.62607015e-34'],['c','299792458'],['F','96485.33212'],['g','9.80665']];
const close=t=>t+')'.repeat(Math.max(0,(t.match(/\(/g)||[]).length-(t.match(/\)/g)||[]).length));
function live(){if(!cx)return '0';try{return fmt(evalX(close(cx),deg,ans))}catch(e){return '…'}}
function press(v){
 const op=/^[+−×÷^%!]/.test(v);
 if(v=='DEG')deg=!deg;
 else if(v=='AC'){cx='';fresh=0}
 else if(v=='⌫')cx=cx.replace(/(ans|[a-z]+\(|.)$/,'');
 else if(v=='='){if(!cx)return;try{const r=evalX(close(cx),deg,ans);if(!isFinite(r))throw 0;hist=[[close(cx),r],...hist].slice(0,30);ans=r;cx=String(parseFloat(r.toPrecision(12)));fresh=1}catch(e){const d=$('.disp');d.classList.remove('err');void d.offsetWidth;d.classList.add('err');toast('Ekspresi tidak valid')}}
 else{if(fresh){if(!op)cx='';fresh=0}cx+=v}
 draw()}
function draw(){
 $('#ex').textContent=cx||' ';$('#rs').textContent=live();$('#md').textContent=deg?'DEG':'RAD';
 const h=$('#hs');h.innerHTML=hist.length?'':'<span class="mu">Riwayat perhitungan akan muncul di sini.</span>';
 hist.forEach(([e,r])=>{const b=E('button','',`${e}<b>= ${fmt(r)}</b>`);b.onclick=()=>{cx=String(parseFloat(r.toPrecision(12)));fresh=1;draw()};h.append(b)})}
function calcView(){
 const v=$('#view');v.innerHTML='';
 const w=E('div','calc'),l=E('section','pn pad'),s=E('aside','pn side');
 l.innerHTML='<div class="disp"><span id="md"></span><div id="ex"></div><div id="rs">0</div></div>';
 const kp=E('div','keys');K.forEach(([a,b,c])=>{const x=E('button','k '+(c||''),a);x.dataset.v=b||a;kp.append(x)});
 kp.onclick=e=>{const b=e.target.closest('.k');if(b)press(b.dataset.v)};l.append(kp);
 s.innerHTML='<h3>Riwayat</h3><div id="hs"></div><h3>Konstanta fisika</h3>';
 const cs=E('div','cs');CS.forEach(([n,val])=>{const b=E('button','',n);b.title=val;b.onclick=()=>{if(fresh){cx='';fresh=0}cx+=val;draw()};cs.append(b)});s.append(cs);
 w.append(l,s);v.append(w);draw()}

/* ---------- Modul laboratorium ---------- */
const U={Volume:{L:1,mL:1e-3,'µL':1e-6,'m³':1e3,gal:3.78541},Massa:{kg:1,g:1e-3,mg:1e-6,'µg':1e-9,lb:.453592},Tekanan:{Pa:1,kPa:1e3,bar:1e5,psi:6894.757,mmHg:133.322,'inH₂O':249.089},Waktu:{s:1,menit:60,jam:3600,hari:86400},Suhu:{'°C':1,'°F':1,K:1}};
const UO=[].concat(...Object.entries(U).map(([c,o])=>Object.keys(o).map(u=>c+'|'+u)));
const toC=(x,u)=>u=='°F'?(x-32)*5/9:u=='K'?x-273.15:x,fromC=(c,u)=>u=='°F'?c*9/5+32:u=='K'?c+273.15:c;
const MOD=[
{id:'dil',ic:'⚗',t:'Pengenceran C₁V₁ = C₂V₂',d:'Kosongkan tepat satu kolom yang ingin dicari. Satuan mengikuti input Anda.',p:1,
 f:[['c1','C₁ konsentrasi stok','1000'],['v1','V₁ volume stok',''],['c2','C₂ konsentrasi akhir','10'],['v2','V₂ volume akhir','100']],
 run:v=>{const k=Object.keys(v).filter(x=>isNaN(v[x]));if(k.length!=1)return[['Petunjuk','Kosongkan tepat satu kolom','']];
  const{c1,v1,c2,v2}=v,r={c1:c2*v2/v1,v1:c2*v2/c1,c2:c1*v1/v2,v2:c1*v1/c2}[k[0]],o=[['Hasil '+{c1:'C₁',v1:'V₁',c2:'C₂',v2:'V₂'}[k[0]],r,'',1]];
  if(k[0]=='v1')o.push(['Volume pelarut',v2-r,'sama dengan satuan V']);if(k[0]=='v2')o.push(['Volume pelarut',r-v1,'sama dengan satuan V']);
  o.push(['Faktor pengenceran',c1/c2||v2/v1,'×']);return o}},
{id:'mol',ic:'⚖',t:'Molaritas larutan',d:'Hitung konsentrasi dari massa zat terlarut, massa molar, dan volume akhir.',
 f:[['m','Massa zat (g)','5.844'],['mw','Massa molar (g/mol)','58.44'],['vol','Volume akhir (mL)','100']],
